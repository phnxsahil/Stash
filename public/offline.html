<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline | Stash</title>
  <style>
    * { box-sizing: border-box; }
    @font-face { font-family: "Plus Jakarta Sans"; font-style: normal; font-weight: 400 800; font-display: swap; src: url("/fonts/plus-jakarta-sans.woff2") format("woff2"); }
    :root {
      color-scheme: light dark;
      font-family: "Plus Jakarta Sans", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f7f8f5;
      color: #1b211b;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #131313;
        color: #e5e2e1;
      }
    }
    .panel {
      width: min(520px, 100%);
      border: 1px solid rgba(80, 99, 84, 0.25);
      border-radius: 18px;
      padding: 24px;
      background: rgba(255, 255, 255, 0.68);
      backdrop-filter: blur(8px);
    }
    @media (prefers-color-scheme: dark) {
      .panel {
        background: #1c1b1b;
        border-color: rgba(157, 190, 160, 0.25);
      }
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.45rem;
    }
    p {
      margin: 0;
      opacity: 0.85;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="panel">
    <img src="/stash-logo.svg" width="40" height="40" alt="Stash" style="margin-bottom:16px" />
    <h1>You are offline right now</h1>
    <p>Stash saved this shell so you can still open parts of the app. Reconnect to stash new songs and sync with Spotify.</p>
  </main>
</body>
</html>
